<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataHub Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 220px;
            min-height: 100vh;
            background-color: #ffffff;
            padding: 20px;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            background-color: #e5e7eb;
            cursor: pointer;
            text-align: left;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            width: 180px;
            border-radius: 8px;
        }

        .card h2 {
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>DataHub</h1>
        <p>Data Integration & Analytics Platform</p>
    </div>

    <div class="container">

        <div class="sidebar">

            <button>Dashboard</button>

              <a href="/add-data">
                 <button>Add Data</button>
              </a>


            <button>Add Data</button>
            <button>Documents</button>
            <button>Data Integration</button>
            <button>Reports</button>
            <button>Settings</button>

        </div>

        <div class="content">

            <h2>Welcome to DataHub</h2>

            <p>
                Manage, integrate and visualize your data from one platform.
            </p>

            <div class="cards">

                <div class="card">
                    <h2>0</h2>
                    <p>Records</p>
                </div>

                <div class="card">
                    <h2>0</h2>
                    <p>Documents</p>
                </div>

                <div class="card">
                    <h2>0</h2>
                    <p>Data Sources</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
